mutation SettleByAmountMutation(
    $tripId: Int!
    $fromUserId: Int!
    $toUserId: Int!
    $amount: Float!
    $currency: String!
    $isMainCurrency: Boolean!
) {
    settleByAmount(
        tripId: $tripId
        fromUserId: $fromUserId
        toUserId: $toUserId
        amount: $amount
        currency: $currency
        isMainCurrency: $isMainCurrency
    ) {
        success
        message
    }
}
