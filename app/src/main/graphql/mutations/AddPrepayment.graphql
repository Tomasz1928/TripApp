mutation AddPrepaymentMutation(
    $tripId: Int!
    $participantId: Int!
    $amount: Float!
    $currency: String!
    $direction: String!
) {
    addPrepayment(
        tripId: $tripId
        participantId: $participantId
        amount: $amount
        currency: $currency
        direction: $direction
    ) {
        success
        message
    }
}
