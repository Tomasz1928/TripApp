# ============================================================
# Plik: app/src/main/graphql/com/example/tripapp2/queries/TripDetails.graphql
# ============================================================
query TripDetailsQuery($tripId: Int!) {
    tripDetails(tripId: $tripId) {
        categories {
            categoryId
            totalAmount
        }
        currency
        dateEnd
        dateStart
        description
        expenses {
            amount
            categoryId
            currency
            date
            description
            id
            payerNickname
            name
            payerId
            hasReceipt
            receiptHash
            sharedWith {
                participantId
                participantNickname
                splitValue {
                    isMainCurrency
                    currency
                    amount
                }
                isSettlement
                leftForSettlement {
                    isMainCurrency
                    currency
                    amount
                }
                settlementBreakdown {
                    type
                    amountCost
                    amountTrip
                }
            }
            totalExpense {
                amount
                currency
                isMainCurrency
            }
        }
        id
        imOwner
        myParticipantId
        myCost {
            amount
            currency
            isMainCurrency
        }
        totalTripCost {
            amount
            currency
            isMainCurrency
        }
        ownerId
        participants {
            accessCode
            id
            isActive
            isOwner
            isPlaceholder
            nickname
            totalExpenses {
                amount
                currency
                isMainCurrency
            }
        }
        settlement {
            relations {
                relatedId
                relatedName
                leftForSettled {
                    isMainCurrency
                    currency
                    amount
                }
                allRelatedAmount {
                    isMainCurrency
                    currency
                    amount
                }
                prepayment {
                    amountLeft {
                        isMainCurrency
                        currency
                        amount
                    }
                    history {
                        date
                        values {
                            isMainCurrency
                            currency
                            amount
                        }
                    }
                }
                settlementHistory {
                    id
                    settlementType
                    actorNickname
                    amountInSettlementCurrency
                    settlementCurrency
                    amountInTripCurrency
                    relatedExpenseNames
                    createdAt
                }
            }
        }
        title
        totalExpenses
    }
}